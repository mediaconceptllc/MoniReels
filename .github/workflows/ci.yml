name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the run in flight. Without this, pushing three fixes
# in a minute queues three full runs and the first two answer questions
# nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only for every job. Nothing here pushes, comments or publishes, so the
# token a step (or a compromised action) can reach is no use beyond reading
# this repository. A job that ever needs more asks for it by name.
permissions:
  contents: read

# Third-party actions are pinned to a commit, with the release in a comment:
# a tag can be moved to different code after this file was reviewed, a commit
# cannot. Dependabot (.github/dependabot.yml) bumps both together.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A hung test or a stuck service container fails here, not after the
    # platform's six-hour default. A normal run is about four minutes.
    timeout-minutes: 20

    # A REAL Postgres, not SQLite. The project document is JSONB and the
    # queue claims rows with FOR UPDATE SKIP LOCKED — neither exists in
    # SQLite, so a SQLite run would pass while the two things most worth
    # testing went unexercised.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monireels
          POSTGRES_PASSWORD: monireels
          POSTGRES_DB: monireels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://monireels:monireels@localhost:5432/monireels_test
      # 32+ bytes: PyJWT warns on every call with a shorter HS256 key.
      JWT_SECRET: ci-secret-not-a-real-key-32-bytes-long
      LOG_LEVEL: WARNING

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The suite is hermetic and passes without ffmpeg, but the runtime
      # image has it — so CI has it too. A test that only passes because a
      # binary is missing is a test that will surprise someone in production.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      # The types are documentation the code is checked against. Off CI they
      # drifted to sixty errors — among them a provider contract that did not
      # name two of the three methods every caller used.
      - name: Type check
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      # The check that earns its place: `create_all` is never run in
      # production, so a column added to dbmodels.py without a migration
      # simply would not exist on the deployed database — and nothing else
      # would say so until a query failed at runtime.
      - name: Models match migrations
        run: |
          if ! alembic check; then
            echo "::error::A model changed without a migration. Run: alembic revision --autogenerate -m '...'"
            exit 1
          fi

      - name: Migrations reverse cleanly
        run: alembic downgrade base && alembic upgrade head

      # A failing test also prints an `::error file=…,line=…` annotation
      # (tests/conftest.py): annotations come with the check run, so the
      # failure can be read without fetching this job's log.
      - name: Tests
        run: pytest tests -q

      # The tests just REWROTE frontend/.shape from the live API. If that
      # differs from what is committed, an API response changed shape and the
      # frontend's copy of the contract was never updated — so the frontend
      # job would go on checking itself against a fixture from before the
      # change and pass. This is the step that makes the whole mechanism
      # honest; without it the fixtures can quietly go stale forever.
      - name: The captured API shapes are up to date
        run: |
          if ! git diff --exit-code -- ../frontend/.shape; then
            echo "::error::An API response changed shape. Run pytest tests/test_frontend_shape.py and commit frontend/.shape/"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Blocking at HIGH since the upgrade (audit DEP-1). `npm audit` cannot
      # ignore anything, so the script runs it and lets through only the
      # advisories it names, each with its reason — today one: braces, which
      # has no fixed release and reaches only the linter. Every advisory,
      # blocking or not, goes to the job summary and a blocking one also to an
      # annotation.
      - name: No high or critical advisory in the dependencies
        run: npm run check-audit

      - run: npm run typecheck

      - run: npm run lint

      # The only step that looks at BOTH halves. typecheck, lint and build all
      # ask whether the frontend agrees with itself; this one assigns the
      # backend's real JSON to the types the components read, so a renamed
      # field fails here instead of rendering as `undefined` for a user.
      # The fixtures are committed — see frontend/.shape/README.md.
      - run: npm run verify-shape

      # Two interface rules a type checker cannot hold: every tap target is at
      # least 44px, and a loading REGION uses Skeleton rather than Spinner. Both
      # are defaults living in the primitives, and a default is only worth
      # having if the next component cannot quietly opt out of it.
      - run: npm run check-ui

      # Two client paths whose failure is silent. The job stream split on
      # "\n\n" while the server frames with CRLF, so no event was ever read
      # and every job fell back to polling after eight seconds; and every 401
      # was read as an expired session, including a mistyped password.
      - run: npm run check-sse
      - run: npm run check-auth

      # The browser half of the multipart upload: a dropped part or an
      # expired URL retried alone, a reload resuming without resending, cancel
      # aborting the stored parts, small files and old servers on one PUT.
      - run: npm run check-upload

      # The interface is Mongolian; the worker and the browser are not. Known
      # worker errors must map to Mongolian with the right "retry helps?" flag,
      # relative times must not fall back to Intl's English, and validation
      # lists must not leak Pydantic's English.
      - run: npm run check-copy

      # A placeholder is fine: NEXT_PUBLIC_API_URL is baked in at build time
      # and nothing here calls it. What is being checked is that the build
      # compiles, not that it can reach a server.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A runner's DEFAULT buildx builder uses the `docker` driver, which
      # cannot export a cache — `cache-to: type=gha` fails the build outright
      # with "Cache export is not supported for the docker driver". This
      # switches to the `docker-container` driver, which supports both the
      # GHA cache and `load: true`.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Both Railway services run this one image, so a Dockerfile that no
      # longer builds breaks the API and the worker together — and would
      # otherwise only be discovered at deploy time. `load: true` hands the
      # built image to the local daemon so the next step can run it, instead
      # of building it a second time.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: false
          load: true
          tags: monireels-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image can actually run
        run: |
          docker run --rm monireels-ci:latest sh -euc '
            ffmpeg -version > /dev/null
            ffprobe -version > /dev/null

            # Burned-in subtitles are rendered by libass against a font in
            # this image. With no Cyrillic face every Mongolian subtitle
            # comes out as empty boxes — inside the exported video, where
            # nobody notices until a customer does.
            fc-list :lang=mn | grep -q . || {
              echo "::error::No font with Cyrillic coverage in the image"
              exit 1
            }

            # Both entrypoints must import with NO environment set. A module
            # that reads a required variable at import time turns a missing
            # config value into a crash loop rather than a clear error.
            python -c "import app.main, app.worker"
          '

      # What the image actually runs — every installed package, the
      # transitive ones included — checked against the advisory databases.
      # Blocking since the upgrade (audit DEP-1). An advisory that cannot be
      # fixed yet is let through BY NAME — `--ignore-vuln <ID>` on the line
      # below, with a comment saying why and when to look again; none is
      # today. The findings go to the job summary and to annotations.
      - name: No known advisory in the image
        run: |
          docker run --rm monireels-ci:latest pip freeze --all | sed -E 's/\+cpu$//' > /tmp/freeze.txt
          status=0
          pipx run --spec pip-audit==2.10.1 pip-audit -r /tmp/freeze.txt --no-deps --disable-pip \
            --progress-spinner off -f json -o /tmp/audit.json || status=$?
          python3 .github/scripts/pip_audit_report.py /tmp/audit.json monireels-ci:latest || status=$?
          exit $status

  dub-image:
    name: Worker image with the clean dub
    runs-on: ubuntu-latest
    # A cold build downloads torch and the model's weights.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The worker service is built with INSTALL_DUB=1 (docs/DEPLOY.md):
      # torch, Demucs and the model's weights, baked in. The image above
      # never has them, so it proves nothing about this one — and the backend
      # tests fake the separation itself. This is the only place the real
      # model runs before production.
      #
      # Its own cache scope: sharing the default one with the image above
      # would have each build evict the other's layers, and these are the
      # expensive ones.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: false
          load: true
          tags: monireels-dub-ci:latest
          build-args: |
            INSTALL_DUB=1
          cache-from: type=gha,scope=dub
          cache-to: type=gha,scope=dub,mode=max

      - name: The worker image can remove the speech
        run: |
          docker image inspect -f 'Image size: {{.Size}} bytes' monireels-dub-ci:latest
          # --network none: the weights must already be IN the image. A worker
          # that fetched them on its first dub would fail that dub whenever the
          # download did, and fetch them again after every restart.
          docker run --rm --network none monireels-dub-ci:latest sh -euc '
            python -c "import app.main, app.worker"
            python -m app.audio.dub_bed --smoke
          '

      # What the image actually runs — every installed package, the
      # transitive ones included — checked against the advisory databases.
      # Blocking since the upgrade (audit DEP-1). An advisory that cannot be
      # fixed yet is let through BY NAME — `--ignore-vuln <ID>` on the line
      # below, with a comment saying why and when to look again; none is
      # today. The findings go to the job summary and to annotations.
      - name: No known advisory in the worker image
        run: |
          docker run --rm monireels-dub-ci:latest pip freeze --all | sed -E 's/\+cpu$//' > /tmp/freeze.txt
          status=0
          pipx run --spec pip-audit==2.10.1 pip-audit -r /tmp/freeze.txt --no-deps --disable-pip \
            --progress-spinner off -f json -o /tmp/audit.json || status=$?
          python3 .github/scripts/pip_audit_report.py /tmp/audit.json monireels-dub-ci:latest || status=$?
          exit $status
